# Fallback if Poolside.xcodeproj won't open: brew install xcodegen && xcodegen
name: Poolside
options:
  bundleIdPrefix: com.stylehatch
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Poolside:
    type: application
    platform: iOS
    sources: [Poolside]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stylehatch.poolside
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Poolside
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Poolside talks to your Pentair ScreenLogic adapter on your home WiFi.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
